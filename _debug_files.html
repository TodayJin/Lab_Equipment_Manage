    <script>
    // 心跳：每45秒告诉服务器我在线
    
    setInterval(function() {
        fetch('/chat/heartbeat', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(function(){});
    }, 45000);
    fetch('/chat/heartbeat', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}).catch(function(){});
    

    // ── Sidebar interactivity ──
    (function() {
        var sidebar = document.getElementById('sidebar');
        if (!sidebar) return;

        var collapseBtn = document.getElementById('sidebarCollapse');
        var toggleBtn = document.getElementById('sidebarToggle');
        var topbarToggle = document.getElementById('topbarToggle');
        var overlay = document.getElementById('sidebarOverlay');
        var searchInput = sidebar.querySelector('.sidebar-search-input');
        var isMobile = function() { return window.innerWidth < 768; };

        // Desktop collapse (slides off-screen)
        if (collapseBtn) {
            collapseBtn.addEventListener('click', function() {
                sidebar.classList.toggle('collapsed');
                try { localStorage.setItem('sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : ''); } catch(e) {}
            });
        }

        // Topbar hamburger: on mobile opens drawer, on desktop expands collapsed sidebar
        function handleToggle() {
            if (isMobile()) {
                sidebar.classList.add('open');
                if (overlay) overlay.classList.add('show');
            } else {
                sidebar.classList.remove('collapsed');
                try { localStorage.setItem('sidebar-collapsed', ''); } catch(e) {}
            }
        }
        function closeSidebar() { sidebar.classList.remove('open'); if (overlay) overlay.classList.remove('show'); }

        if (toggleBtn) toggleBtn.addEventListener('click', handleToggle);
        if (topbarToggle) topbarToggle.addEventListener('click', handleToggle);
        if (overlay) overlay.addEventListener('click', closeSidebar);

        // Restore collapse state on desktop
        if (!isMobile()) {
            try {
                if (localStorage.getItem('sidebar-collapsed') === '1') {
                    sidebar.classList.add('collapsed');
                }
            } catch(e) {}
        }

        // Close mobile drawer on resize to desktop
        window.addEventListener('resize', function() {
            if (!isMobile()) closeSidebar();
        });

        // Escape closes mobile drawer
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && sidebar.classList.contains('open')) closeSidebar();
        });

        // Ctrl+K focuses search
        if (searchInput) {
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    sidebar.classList.remove('collapsed');
                    try { localStorage.setItem('sidebar-collapsed', ''); } catch(e) {}
                    searchInput.focus();
                }
            });
        }

        // Search filtering
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                var q = this.value.toLowerCase().trim();
                var items = sidebar.querySelectorAll('.nav-item');
                var dividers = sidebar.querySelectorAll('.nav-divider');
                items.forEach(function(item) {
                    var text = item.querySelector('.nav-text');
                    if (!text) return;
                    item.style.display = (!q || text.textContent.toLowerCase().includes(q)) ? '' : 'none';
                });
                dividers.forEach(function(d) { d.style.display = (!q) ? '' : 'none'; });
            });
        }
    })();
    </script>

<script>
const CHUNK_SIZE = 10 * 1024 * 1024; // 10MB per chunk

let currentXhr = null;
let currentUploadId = null;
let cancelled = false;

function cancelUpload() {
    cancelled = true;
    if (currentXhr) { currentXhr.abort(); currentXhr = null; }
    if (currentUploadId) {
        // Tell server to clean up temp chunks
        fetch('/chat/cancel-upload?upload_id=' + currentUploadId, { method: 'POST' });
        currentUploadId = null;
    }
    document.getElementById('uploadProgress').style.display = 'none';
    document.getElementById('upCancel').style.display = 'none';
}

function uploadWithProgress(form, event) {
    var fileInput = form.querySelector('input[type="file"]');
    var file = fileInput.files[0];
    if (!file) return true;
    event.preventDefault();

    cancelled = false;
    currentXhr = null;
    currentUploadId = null;

    var progress = document.getElementById('uploadProgress');
    var bar = document.getElementById('upBar');
    var filename = document.getElementById('upFilename');
    var speed = document.getElementById('upSpeed');
    var sent = document.getElementById('upSent');
    var total = document.getElementById('upTotal');
    var cancelBtn = document.getElementById('upCancel');

    progress.style.display = 'block';
    cancelBtn.style.display = '';
    filename.textContent = file.name;
    total.textContent = formatSize(file.size);
    bar.style.width = '0%';
    bar.classList.remove('bg-success', 'bg-danger');
    speed.textContent = '0%';
    sent.textContent = '0 KB';

    var targetType = form.querySelector('[name="p2p_file"]') ? 'p2p' : 'shared';
    var receiverId = form.querySelector('[name="receiver_id"]')?.value || 0;
    var description = form.querySelector('[name="description"]')?.value || '';

    var totalChunks = Math.ceil(file.size / CHUNK_SIZE);
    var uploadId = crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36) + Math.random().toString(36).slice(2));
    currentUploadId = uploadId;
    var startTime = Date.now();
    var uploaded = 0;

    function uploadChunk(index) {
        if (cancelled) return;
        if (index >= totalChunks) return;

        var start = index * CHUNK_SIZE;
        var end = Math.min(start + CHUNK_SIZE, file.size);
        var blob = file.slice(start, end);

        var fd = new FormData();
        fd.append('upload_id', uploadId);
        fd.append('chunk_index', index);
        fd.append('total_chunks', totalChunks);
        fd.append('original_name', file.name);
        fd.append('target_type', targetType);
        if (targetType === 'p2p') fd.append('receiver_id', receiverId);
        if (targetType === 'shared') fd.append('description', description);
        fd.append('file', blob, 'chunk_' + index);

        currentXhr = new XMLHttpRequest();
        currentXhr.open('POST', '/chat/chunk-upload');

        currentXhr.addEventListener('load', function() {
            if (cancelled) return;
            currentXhr = null;
            if (this.status >= 200 && this.status < 400) {
                var resp = JSON.parse(this.responseText);
                if (resp.ok) {
                    uploaded += (end - start);
                    var pct = Math.round(uploaded / file.size * 100);
                    bar.style.width = pct + '%';
                    sent.textContent = formatSize(uploaded);

                    var elapsed = (Date.now() - startTime) / 1000;
                    if (elapsed > 0) {
                        speed.textContent = formatSpeed(uploaded / elapsed) + ' · ' + pct + '%';
                    }

                    if (resp.status === 'complete') {
                        bar.classList.add('bg-success');
                        bar.style.width = '100%';
                        speed.textContent = formatSize(file.size) + ' 上传完成';
                        cancelBtn.style.display = 'none';
                        currentUploadId = null;
                        setTimeout(function() { progress.style.display = 'none'; }, 2000);
                        setTimeout(function() { window.location.reload(); }, 800);
                        return;
                    }
                    uploadChunk(index + 1);
                } else {
                    speed.textContent = resp.error || '上传失败';
                    bar.classList.add('bg-danger');
                    cancelBtn.style.display = 'none';
                }
            } else {
                speed.textContent = '错误（片' + (index + 1) + '/' + totalChunks + '）';
                bar.classList.add('bg-danger');
                cancelBtn.style.display = 'none';
            }
        });

        currentXhr.addEventListener('error', function() {
            if (cancelled) return;
            currentXhr = null;
            speed.textContent = '网络错误（片' + (index + 1) + '/' + totalChunks + '）';
            bar.classList.add('bg-danger');
            cancelBtn.style.display = 'none';
        });

        currentXhr.send(fd);
    }

    uploadChunk(0);
    return false;
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    if (bytes < 1048576 * 1024) return (bytes / 1048576).toFixed(2) + ' MB';
    return (bytes / 1073741824).toFixed(2) + ' GB';
}

function formatSpeed(bytesPerSec) {
    if (bytesPerSec < 1048576) return (bytesPerSec / 1024).toFixed(1) + ' KB/s';
    return (bytesPerSec / 1048576).toFixed(1) + ' MB/s';
}

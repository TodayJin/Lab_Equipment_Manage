{% extends "base.html" %}
{% block title %}用户设置 - 电子技术创新实验室{% endblock %}
{% block page_title %}用户设置{% endblock %}

{% block content %}
<div class="form-card" style="max-width:600px">
    <!-- 深色模式 — 即时切换 -->
    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <label class="form-label fw-semibold mb-1">
                    <i class="bi bi-moon-stars me-2"></i>深色模式
                </label>
                <p class="text-muted small mb-0" id="dmHint">
                    {% if dark_mode %}已开启深色模式{% else %}点击开关即时切换{% endif %}
                </p>
            </div>
            <div class="form-check form-switch ms-3">
                <input class="form-check-input dm-toggle" type="checkbox" role="switch"
                       style="width:3em; height:1.5em;"
                       {% if dark_mode %}checked{% endif %}
                       onchange="toggleDarkMode(this)">
            </div>
        </div>
    </div>

    <hr>

    <!-- 配色主题 -->
    <div class="mb-4">
        <label class="form-label fw-semibold mb-3">
            <i class="bi bi-palette me-2"></i>配色主题
        </label>
        <div class="d-flex gap-2 flex-wrap" id="themePicker">
            <label class="theme-option" data-theme="purple" style="cursor:pointer">
                <input type="radio" name="color_theme" value="purple" class="d-none" {% if color_theme == 'purple' %}checked{% endif %}>
                <span class="theme-swatch" style="background:linear-gradient(135deg,#8C57FF,#A379FF)"></span>
                <small>紫</small>
            </label>
            <label class="theme-option" data-theme="blue" style="cursor:pointer">
                <input type="radio" name="color_theme" value="blue" class="d-none" {% if color_theme == 'blue' %}checked{% endif %}>
                <span class="theme-swatch" style="background:linear-gradient(135deg,#3B82F6,#60A5FA)"></span>
                <small>蓝</small>
            </label>
            <label class="theme-option" data-theme="green" style="cursor:pointer">
                <input type="radio" name="color_theme" value="green" class="d-none" {% if color_theme == 'green' %}checked{% endif %}>
                <span class="theme-swatch" style="background:linear-gradient(135deg,#10B981,#34D399)"></span>
                <small>绿</small>
            </label>
            <label class="theme-option" data-theme="orange" style="cursor:pointer">
                <input type="radio" name="color_theme" value="orange" class="d-none" {% if color_theme == 'orange' %}checked{% endif %}>
                <span class="theme-swatch" style="background:linear-gradient(135deg,#F59E0B,#FBBF24)"></span>
                <small>橙</small>
            </label>
            <label class="theme-option" data-theme="rose" style="cursor:pointer">
                <input type="radio" name="color_theme" value="rose" class="d-none" {% if color_theme == 'rose' %}checked{% endif %}>
                <span class="theme-swatch" style="background:linear-gradient(135deg,#EC4899,#F472B6)"></span>
                <small>粉</small>
            </label>
        </div>
    </div>

    <hr>

    <!-- 每页显示数量 — 即时保存 -->
    <div class="mb-4">
            <label class="form-label fw-semibold">
                <i class="bi bi-list-ol me-2"></i>每页显示数量
            </label>
            <p class="text-muted small mb-2">设置列表页面每页显示的数据条数</p>
            <select class="form-select" name="items_per_page" onchange="savePageSize(this.value)">
                <option value="10" {% if items_per_page == 10 %}selected{% endif %}>10 条</option>
                <option value="15" {% if items_per_page == 15 %}selected{% endif %}>15 条</option>
                <option value="20" {% if items_per_page == 20 %}selected{% endif %}>20 条</option>
                <option value="30" {% if items_per_page == 30 %}selected{% endif %}>30 条</option>
                <option value="50" {% if items_per_page == 50 %}selected{% endif %}>50 条</option>
            </select>
        </div>

        <hr>

        <div class="d-flex gap-2">
            <a href="{{ url_for('auth.change_password') }}" class="btn btn-outline-secondary">
                <i class="bi bi-key"></i> 修改密码
            </a>
        </div>
    </div>
</div>

{% block extra_scripts %}
<style>
.theme-option{text-align:center;padding:8px 12px;border-radius:12px;border:2px solid transparent;transition:all .2s}
.theme-option.selected{border-color:var(--pri);background:rgba(140,87,255,.06)}
.theme-swatch{display:block;width:36px;height:36px;border-radius:50%;margin:0 auto 4px;box-shadow:0 2px 6px rgb(0 0 0 / .12);transition:transform .2s}
.theme-option:hover .theme-swatch{transform:scale(1.15)}
.theme-option small{font-size:12px;color:var(--ts)}
</style>
<script>
// 初始化选中状态
document.querySelectorAll('.theme-option input').forEach(function(r){
    if(r.checked) r.parentElement.classList.add('selected');
});
// 点击切换配色
document.getElementById('themePicker').addEventListener('click', function(e){
    var label = e.target.closest('.theme-option');
    if(!label) return;
    var theme = label.dataset.theme;
    document.querySelectorAll('.theme-option').forEach(function(l){l.classList.remove('selected')});
    label.classList.add('selected');
    label.querySelector('input').checked = true;
    document.documentElement.setAttribute('data-theme', theme);
    // 即时保存
    fetch('/settings/api', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({color_theme:theme})
    });
});

function savePageSize(val) {
    fetch('/settings/api', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({items_per_page:parseInt(val)})
    }).then(function(r){return r.json()}).then(function(d){
        if(d.ok) LabToast.show('每页显示 '+val+' 条，已保存', 'success', 2000);
    });
}

function toggleDarkMode(checkbox) {
    const dark = checkbox.checked;
    const hint = document.getElementById('dmHint');

    // Add overlay animation
    let overlay = document.createElement('div');
    overlay.className = 'theme-overlay';
    if (!dark) overlay.style.background = '#fff';
    document.body.appendChild(overlay);

    requestAnimationFrame(() => {
        overlay.classList.add('active');
    });

    setTimeout(() => {
        // Enable/disable the dark CSS stylesheet
        const darkCss = document.getElementById('dark-css');
        if (dark) {
            document.documentElement.classList.add('dark');
            if (darkCss) darkCss.disabled = false;
        } else {
            document.documentElement.classList.remove('dark');
            if (darkCss) darkCss.disabled = true;
        }
        hint.textContent = dark ? '已开启深色模式' : '已关闭深色模式';

        setTimeout(() => {
            overlay.classList.remove('active');
            setTimeout(() => overlay.remove(), 600);
        }, 150);

        // Save to server
        fetch('/settings/api', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({dark_mode: dark})
        });
    }, 300);
}
</script>
{% endblock %}
{% endblock %}
